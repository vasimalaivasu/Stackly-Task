<!DOCTYPE html>
<html lang="en">
<head>
    <title>Task-10</title>
    <style>
        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .card {
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 10px;
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
        }
        .buy-btn {
            padding: 10px 20px;
            background: green;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Products</h1>
    <div class="products"></div>
    <script src="script10.js"></script>
</body>
</html>
